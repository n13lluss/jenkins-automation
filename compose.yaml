# Local development stack. Copy .env.example to .env first (or run scripts/dev-env.sh).
# Only the frontend (3000) and Keycloak (8081) are published, and only on localhost.

x-hardening: &hardening
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: pipelineforge
      POSTGRES_USER: pipelineforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipelineforge -d pipelineforge"]
      interval: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  vault:
    image: hashicorp/vault:1.20.4
    command: ["server", "-config=/vault/config/config.hcl"]
    volumes:
      - ./deploy/compose/vault/config.hcl:/vault/config/config.hcl:ro
      - vault-data:/vault/file
    security_opt: ["no-new-privileges:true"]

  vault-init:
    image: hashicorp/vault:1.20.4
    entrypoint: ["/bin/sh", "/init.sh"]
    user: root
    depends_on: [vault]
    volumes:
      - ./deploy/compose/vault/init.sh:/init.sh:ro
      - vault-init:/vault/init
      - vault-approle:/vault/approle
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HTTP_PORT: "8080"
      # Browser-facing URL; containers reach Keycloak at http://keycloak:8080 (backchannel).
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      PF_CLIENT_SECRET: ${PF_CLIENT_SECRET:?set PF_CLIENT_SECRET in .env}
      PF_DEMO_PASSWORD: ${PF_DEMO_PASSWORD:?set PF_DEMO_PASSWORD in .env}
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./deploy/compose/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "127.0.0.1:8081:8080"
    security_opt: ["no-new-privileges:true"]

  backend:
    build: ./backend
    <<: *hardening
    tmpfs: ["/tmp"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Database=pipelineforge;Username=pipelineforge;Password=${POSTGRES_PASSWORD}
      Database__MigrateOnStartup: "true"
      Auth__Authority: http://localhost:8081/realms/pipelineforge
      Auth__MetadataAddress: http://keycloak:8080/realms/pipelineforge/.well-known/openid-configuration
      Auth__RequireHttpsMetadata: "false"
      Auth__Audience: pipelineforge-api
      SecretStore__Provider: vault
      SecretStore__Vault__Address: http://vault:8200
      SecretStore__Vault__RoleIdFile: /vault/approle/role-id
      SecretStore__Vault__SecretIdFile: /vault/approle/secret-id
      Outbound__AllowHttp: ${OUTBOUND_ALLOW_HTTP:-false}
      Outbound__AllowPrivateNetworks: ${OUTBOUND_ALLOW_PRIVATE:-false}
      Outbound__PrivateHosts__0: ${OUTBOUND_PRIVATE_HOST:-jenkins}
    volumes:
      - vault-approle:/vault/approle:ro
    depends_on:
      postgres: { condition: service_healthy }
      vault-init: { condition: service_completed_successfully }
      keycloak: { condition: service_started }

  frontend:
    build: ./frontend
    <<: *hardening
    tmpfs: ["/tmp", "/app/.next/cache"]
    environment:
      APP_URL: http://localhost:3000
      BACKEND_URL: http://backend:8080
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      OIDC_ISSUER: http://localhost:8081/realms/pipelineforge
      OIDC_AUTHORIZATION_URL: http://localhost:8081/realms/pipelineforge/protocol/openid-connect/auth
      OIDC_END_SESSION_URL: http://localhost:8081/realms/pipelineforge/protocol/openid-connect/logout
      OIDC_TOKEN_URL: http://keycloak:8080/realms/pipelineforge/protocol/openid-connect/token
      OIDC_JWKS_URL: http://keycloak:8080/realms/pipelineforge/protocol/openid-connect/certs
      OIDC_CLIENT_ID: pipelineforge-web
      OIDC_CLIENT_SECRET: ${PF_CLIENT_SECRET}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [backend]

  jenkins:
    profiles: ["validation"]
    build: ./deploy/compose/jenkins
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-change-me-locally}
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - jenkins-home:/var/jenkins_home

volumes:
  postgres-data:
  keycloak-data:
  vault-data:
  vault-init:
  vault-approle:
  jenkins-home:
